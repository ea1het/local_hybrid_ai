_config_version: 38
# =============================================================================
# Hermes Agent - managed configuration
# Source: stack-60_-_hermes/config/hermes/config.yaml
# Installed by 01-prepare.py into service_-_hermes/config/config.yaml
# Reconciled by reconcile-capabilities.py when optional providers change.
# =============================================================================

model:
  default: ${HERMES_MODEL}
  provider: custom
  base_url: ${LITELLM_BASE_URL}
  api_key: ${LITELLM_API_KEY}
  context_length: 131072

agent:
  # The agent's default behavior is to use the configured model for all 
  # reasoning and tool use. If tool_use_enforcement is true, the agent will 
  # only use the model for reasoning and will require explicit approval to 
  # use any tools.
  tool_use_enforcement: true
  # Safe minimum: web tools are disabled until the optional web.search and
  # web.extract capabilities are both verified. reconcile-capabilities.py
  # is the only Stack6 operation allowed to switch this managed value to [].
  disabled_toolsets: [web]
  system_prompt: |
    <execution_policy>
    Complete the requested work, not just the next conversational
    response.

    When an action requires a tool, execute the tool call before
    claiming that action was performed. Do not end a turn with an
    unfulfilled promise such as "I will check" or "Let me verify".

    Before finishing, check whether the requested outcome was
    achieved. If not, continue when feasible or clearly report
    the specific blocker and remaining work.

    When a tool fails, inspect the actual error before retrying.
    Retry only when there is a concrete reason to expect a
    different result. Do not repeat equivalent failed operations
    or speculate about their cause without evidence.

    Never report a mutation as successful unless the tool result
    confirms it. A failed or unverified operation remains incomplete.
    </execution_policy>

    <deferred_work_policy>
    Use native cronjob scheduling only when successful execution
    depends on a future time, event, availability, deadline, or
    an explicit request for later execution.

    Do not schedule retries merely because a task failed.
    A blocked task requires diagnosis, not automatic deferral.

    Before scheduling, check for existing equivalent jobs when
    duplication is plausible.

    Use one-shot scheduling unless recurrence is required.

    Scheduled prompts must be self-contained and include the
    objective, necessary context, success criteria, and references
    to durable inputs. Never assume future runs retain the current
    conversation history.

    Report what was scheduled and when it will execute, only
    after the scheduling tool confirms success.
    </deferred_work_policy>

    <sandbox_lifecycle_policy>
    Treat the execution sandbox as ephemeral, untrusted working
    storage, never as a durable source of truth.

    Files may be quarantined or deleted automatically.
    Do not depend on any specific retention period.

    Use the sandbox for temporary downloads, builds, tests,
    intermediate outputs, and disposable working files.

    Before finishing, identify outputs that must survive the
    current session or be accessible to future tasks.

    Persist those outputs to an available durable destination
    appropriate to the task, preserving existing files unless
    replacement was explicitly authorized.

    Verify persistence before reporting success.

    If durable storage is unavailable, report the limitation
    explicitly. Never claim a temporary sandbox artifact is
    safely preserved.

    Future scheduled work must have enough information to
    retrieve its required inputs independently.
    </sandbox_lifecycle_policy>

terminal:
  backend: ssh
  cwd: /workspace
  timeout: ${TERMINAL_TIMEOUT}
  persistent_shell: true
  env_passthrough: []

# These backend selections are inert while the web toolset is disabled.
# Stack6 never falls back to an alternate provider: reconciliation enables the
# toolset only after the configured local SearXNG + Firecrawl provider is valid.
web:
  search_backend: searxng
  extract_backend: firecrawl

mcp_servers:
  litellm_gateway:
    url: ${LITELLM_MCP_URL}
    headers:
      Authorization: "Bearer ${LITELLM_MCP_API_KEY}"
    enabled: true
    timeout: 120
    connect_timeout: 60
    supports_parallel_tool_calls: false
    trust: untrusted
    tools:
      resources: false
      prompts: false

tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5

fallback_providers: []

moa:
  default_preset: local-only
  active_preset: ""
  presets:
    default:
      reference_models:
        - provider: custom
          model: ${HERMES_MODEL}
      aggregator:
        provider: custom
        model: ${HERMES_MODEL}
      enabled: false

    local-only:
      reference_models:
        - provider: custom
          model: ${HERMES_MODEL}
      aggregator:
        provider: custom
        model: ${HERMES_MODEL}
      enabled: false

auxiliary:
  vision:
    provider: main
    model: ${HERMES_MODEL}

  web_extract:
    provider: main
    model: ${HERMES_MODEL}

  approval:
    provider: main
    model: ${HERMES_MODEL}

  session_search:
    provider: main
    model: ${HERMES_MODEL}

  skills_hub:
    provider: main
    model: ${HERMES_MODEL}

  mcp:
    provider: main
    model: ${HERMES_MODEL}

  flush_memories:
    provider: main
    model: ${HERMES_MODEL}

  compression:
    provider: auto
    model: ${HERMES_MODEL}

