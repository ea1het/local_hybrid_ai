# Configuratio for botdetection / limiter in SearXNG.
# 01-prepare.py install this in ${BASE_PATH}/service_-_searxng/config/limiter.toml.
#
# Verified against SearXNG 2026.9.30-a9d990033 (searx/limiter.toml as schema).
# Only values are overwritten; rest get default values.

[botdetection]

ipv4_prefix = 32
ipv6_prefix = 48

trusted_proxies = ['127.0.0.0/8', '::1', '172.16.0.0/12']

[botdetection.ip_limit]

filter_link_local = false
# link_token solo tiene sentido para navegadores; los clientes API no cargan
# el CSS/token y serían marcados como sospechosos.
link_token = false

[botdetection.ip_lists]

pass_ip = [
    '172.16.0.0/12',  # redlocal: contenedores que llaman directo a searxng:8080
    '192.168.0.0/16', # typical LAN subnet
]

block_ip = []

# Instancia privada no listada en searx.space: no dar paso a las IPs de
# check.searx.space.
pass_searxng_org = false

# ---------------------------------------------------------------------------
# Activar el limiter (opcional)
#
# 1. settings.yml -> server.limiter: true
# 2. Valkey/Redis accesible. Opción mínima, reutilizando firecrawl-redis con
#    otra base de datos (la 1). En docker-compose.yml, servicio searxng:
#      environment:
#        SEARXNG_VALKEY_URL: "redis://:${REDIS_PASSWORD}@firecrawl-redis:6379/1"
#      depends_on: firecrawl-redis (condition: service_healthy)
#    Sin Valkey, con limiter: true y public_instance: false, SearXNG solo
#    registra un error y NO aplica el limiter (searx/limiter.py).
# ---------------------------------------------------------------------------
# pass_ip tiene prioridad sobre todos los demás métodos (cabeceras, ip_limit).
# CRÍTICO si se activa el limiter: ip_limit permite solo 4 peticiones/hora por
# IP para format != html (API_MAX en searx/botdetection/ip_limit.py). Sin esta
# entrada, Firecrawl, Hermes, Open WebUI y searxng-mcp quedarían bloqueados
# casi de inmediato (HTTP 429). Además fallarían las comprobaciones de
# cabeceras (Accept-Language, User-Agent...) que esos clientes no envían.
