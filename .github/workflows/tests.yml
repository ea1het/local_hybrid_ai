name: Python tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python3 -m pip install pytest==9.0.3

      - name: Install Zsh for completion tests
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Run tests
        run: python3 -B tests/run.py
