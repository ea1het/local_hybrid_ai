name: MPL license compliance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-compliance:
    name: Verify MPL headers and explicit exceptions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Ensure Python module shebangs
        run: python3 tools/apply_python_shebangs.py

      - name: Ensure MPL headers and exception register
        run: python3 tools/apply_mpl_headers.py

      - name: Verify no drift between committed and expected module headers
        run: git diff --exit-code
