name: MPL license compliance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-compliance:
    name: Verify MPL headers and explicit exceptions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify executable Python shebangs
        run: python3 .github/workflows/gha_apply_python_shebangs.py --check

      - name: Verify MPL headers and exception register
        run: python3 .github/workflows/gha_apply_mpl_headers.py --check
