name: Stack5 - Dockhand

services:

  dockhand:
    image: ${DOCKHAND_IMAGE:-fnsys/dockhand:v1.0.40}
    container_name: dockhand
    restart: unless-stopped

    networks:
      - redlocal

    expose:
      - "3000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data

networks:
  redlocal:
    external: true
    name: ${NETWORK_NAME:-redlocal}

volumes:
  dockhand_data:
    external: true
    name: dockhand_data
