[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local_hybrid_ai"
dynamic = ["version"]
description = "Local Hybrid AI stack implementation behind the ./local-ai entry point script."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MPL-2.0" }
dependencies = []

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }

[tool.setuptools]
py-modules = ["version"]
