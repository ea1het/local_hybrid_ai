name: Stack6 - Hermes

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

networks:
  redlocal:
    external: true
    name: ${NETWORK_NAME}

  hermes-exec:
    driver: bridge

services:
  hermes:
    image: ${HERMES_IMAGE}:${HERMES_VERSION:?Set HERMES_VERSION in .env}
    container_name: ${HERMES_CONTAINER}
    restart: unless-stopped
    command: ["gateway", "run"]

    environment:
      TZ: ${TZ}
      HERMES_TIMEZONE: ${TZ}
      HERMES_UID: ${HERMES_UID}
      HERMES_GID: ${HERMES_GID}
      HERMES_MODEL: ${HERMES_MODEL}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_MCP_URL: ${LITELLM_MCP_URL:?Set LITELLM_MCP_URL in .env}
      LITELLM_MCP_API_KEY: ${LITELLM_MCP_API_KEY:?Set LITELLM_MCP_API_KEY in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TERMINAL_TIMEOUT: ${TERMINAL_TIMEOUT}
      HERMES_DASHBOARD: ${HERMES_DASHBOARD}
      HERMES_DASHBOARD_HOST: ${HERMES_DASHBOARD_HOST}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      HERMES_DASHBOARD_BASIC_AUTH_TTL_SECONDS: ${HERMES_DASHBOARD_BASIC_AUTH_TTL_SECONDS}
      API_SERVER_ENABLED: ${API_SERVER_ENABLED}
      API_SERVER_HOST: ${API_SERVER_HOST}
      API_SERVER_PORT: ${API_SERVER_PORT}
      API_SERVER_KEY: ${API_SERVER_KEY}
      API_SERVER_MODEL_NAME: ${API_SERVER_MODEL_NAME}
      API_SERVER_CORS_ORIGINS: ${API_SERVER_CORS_ORIGINS}
      SEARXNG_URL: ${SEARXNG_URL}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      BUZZ_CLI_PATH: ${BUZZ_CLI_PATH:-}
      BUZZ_RELAY_URL: ${BUZZ_RELAY_URL:-}
      BUZZ_PRIVATE_KEY: ${BUZZ_PRIVATE_KEY:-}
      BUZZ_AUTH_TAG: ${BUZZ_AUTH_TAG:-}
      TERMINAL_SSH_HOST: ${TERMINAL_SSH_HOST}
      TERMINAL_SSH_USER: ${TERMINAL_SSH_USER}
      TERMINAL_SSH_PORT: ${TERMINAL_SSH_PORT}
      TERMINAL_SSH_KEY: ${TERMINAL_SSH_KEY}
      TERMINAL_SSH_PERSISTENT: ${TERMINAL_SSH_PERSISTENT}

    volumes:
      - ${BASE_PATH}/${HERMES_SERVICE}/data:/opt/data
      - type: bind
        source: ${BASE_PATH}/${HERMES_MEMORY_SERVICE:?Set HERMES_MEMORY_SERVICE in .env}/data
        target: /opt/data/memories
        bind:
          create_host_path: false
      - ${BASE_PATH}/${HERMES_SERVICE}/config/config.yaml:/opt/data/config.yaml
      - ${BASE_PATH}/${HERMES_SERVICE}/config/ssh:/opt/data/ssh:ro
      - ${BASE_PATH}/${HERMES_SERVICE}/logs:/opt/data/logs

    networks:
      - redlocal
      - hermes-exec

    expose:
      - "8642"
      - "9119"

    depends_on:
      hermes-sandbox:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${API_SERVER_PORT}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging: *logging

  hermes-sandbox:
    build:
      context: ${STACKS_ROOT}/stack6_-_hermes/config/sandbox
      dockerfile: Dockerfile
      args:
        SANDBOX_UID: ${SANDBOX_UID}
        SANDBOX_GID: ${SANDBOX_GID}

    image: ${SANDBOX_IMAGE}
    container_name: ${SANDBOX_CONTAINER}
    hostname: ${SANDBOX_CONTAINER}
    restart: unless-stopped

    environment:
      TZ: ${TZ}
      SANDBOX_WORKSPACE: /workspace
      SANDBOX_STATE_DIR: /var/lib/hermes-sandbox-state

    volumes:
      - ${BASE_PATH}/${SANDBOX_SERVICE}/data/home:/home/agent
      - ${BASE_PATH}/${SANDBOX_SERVICE}/data/workspace:/workspace
      - ${BASE_PATH}/${SANDBOX_SERVICE}/data/state:/var/lib/hermes-sandbox-state
      - ${BASE_PATH}/${SANDBOX_SERVICE}/config/ssh-host:/etc/ssh/hostkeys:ro
      - ${BASE_PATH}/${SANDBOX_SERVICE}/logs:/var/log/hermes-sandbox

    networks:
      - hermes-exec

    expose:
      - "2222"

    read_only: true

    tmpfs:
      - /run:rw,nosuid,nodev,size=64m,mode=755
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
      - /var/tmp:rw,nosuid,nodev,size=256m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_CHROOT

    pids_limit: ${SANDBOX_PIDS}
    mem_limit: ${SANDBOX_MEMORY}
    cpus: ${SANDBOX_CPU}
    shm_size: ${SANDBOX_SHM_SIZE}

    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    logging: *logging

  hermes-memory-sync:
    profiles: ["git-memory"]
    build:
      context: ${STACKS_ROOT}/stack6_-_hermes/config/memory-sync
      dockerfile: Dockerfile
      args:
        MEMORY_SYNC_UID: ${HERMES_UID}
        MEMORY_SYNC_GID: ${HERMES_GID}

    image: ${MEMORY_SYNC_IMAGE}
    container_name: ${MEMORY_SYNC_CONTAINER}
    restart: unless-stopped

    environment:
      TZ: ${TZ}
      MEMORY_SYNC_INTERVAL_SECONDS: ${MEMORY_SYNC_INTERVAL_SECONDS}
      MEMORY_SYNC_BRANCH: ${GITMEM_BRANCH}
      MEMORY_SYNC_EXPECTED_ORIGIN: ${GITMEM_REPOSITORY}
      MEMORY_SYNC_REPO: /work/hermes-memory
      MEMORY_SYNC_SSH_CONFIG: /run/hermes-memory-ssh/ssh_config

    volumes:
      - type: bind
        source: ${BASE_PATH}/${HERMES_MEMORY_SERVICE}/data
        target: /work/hermes-memory
      - type: bind
        source: ${BASE_PATH}/${MEMORY_SYNC_SERVICE}/ssh
        target: /run/hermes-memory-ssh
        read_only: true

    networks:
      - redlocal

    security_opt:
      - no-new-privileges:true

    depends_on:
      hermes:
        condition: service_healthy

    logging: *logging

  hermes-sandbox-cleanup:
    build:
      context: ${STACKS_ROOT}/stack6_-_hermes/config/sandbox-cleanup
      dockerfile: Dockerfile

    image: ${SANDBOX_CLEANUP_IMAGE}
    container_name: ${SANDBOX_CLEANUP_CONTAINER}
    restart: unless-stopped

    environment:
      TZ: ${TZ}
      SANDBOX_CLEANUP_WORKSPACE: /workspace
      SANDBOX_CLEANUP_STATE_DB: /state/state.db
      SANDBOX_CLEANUP_RETENTION_DAYS: ${SANDBOX_CLEANUP_RETENTION_DAYS}
      SANDBOX_CLEANUP_QUARANTINE_DAYS: ${SANDBOX_CLEANUP_QUARANTINE_DAYS}
      SANDBOX_CLEANUP_DB_RETENTION_DAYS: ${SANDBOX_CLEANUP_DB_RETENTION_DAYS}
      SANDBOX_CLEANUP_SWEEP_HOUR: ${SANDBOX_CLEANUP_SWEEP_HOUR}
      SANDBOX_CLEANUP_SWEEP_MINUTE: ${SANDBOX_CLEANUP_SWEEP_MINUTE}

    volumes:
      - type: bind
        source: ${BASE_PATH}/${SANDBOX_SERVICE}/data/workspace
        target: /workspace
      - type: bind
        source: ${BASE_PATH}/${SANDBOX_SERVICE}/data/state
        target: /state

    network_mode: none
    read_only: true

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER

    depends_on:
      hermes-sandbox:
        condition: service_healthy

    logging: *logging
