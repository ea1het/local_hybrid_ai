# ============================================================================
# HAProxy - proxy inverso para casa.lan
#
# Entrada:
#   HTTP  :80  -> contenedor :8080 -> redireccion a HTTPS
#   HTTPS :443 -> contenedor :8443 -> terminacion TLS
#
# Servicios:
#   casa.lan           -> web:80
#   buscar.casa.lan    -> searxng:8080
#   chat.casa.lan      -> open-webui:8080
#   gwia.casa.lan      -> litellm:4000
#   git.casa.lan       -> gitea:3000
#   homelab.casa.lan   -> dockhand:3000
#   agentia.casa.lan   -> hermes:18789
#
#   casa.lan/haproxy   -> estadisticas HAProxy
#
# Todos los servicios internos usan redlocal.
# TLS termina en HAProxy.
# ============================================================================


# ============================================================================
# GLOBAL
# ============================================================================

global
    log stdout format raw local0 info

    presetenv ROOT_HOSTNAME casa.lan

    presetenv WEB_TARGET web:80

    presetenv SEARCH_HOSTNAME buscar
    presetenv SEARCH_TARGET searxng:8080

    presetenv CHAT_HOSTNAME chat
    presetenv CHAT_TARGET open-webui:8080

    presetenv GWIA_HOSTNAME gwia
    presetenv GWIA_TARGET litellm:4000

    presetenv GIT_HOSTNAME git
    presetenv GIT_TARGET gitea:3000

    presetenv HOMELAB_HOSTNAME homelab
    presetenv HOMELAB_TARGET dockhand:3000

    presetenv AGENTIA_HOSTNAME agentia
    presetenv AGENTIA_TARGET hermes:9119


# ============================================================================
# CERTIFICADOS
# ============================================================================

crt-store casa
    crt-base /usr/local/etc/haproxy
    key-base /usr/local/etc/haproxy

    load crt "casa.lan.crt" key "casa.lan.key" alias "casa-lan"


# ============================================================================
# DEFAULTS
# ============================================================================

defaults
    log global
    mode http

    option httplog
    option forwardfor

    timeout connect 5s
    timeout client  1m
    timeout server  1m
    timeout tunnel  1h


# ============================================================================
# DNS DOCKER
#
# Lee los nameservers de /etc/resolv.conf del contenedor.
# En Docker esto permite utilizar su DNS interno.
#
# Los backends pueden no existir cuando HAProxy arranca.
# init-addr last,none evita que eso impida arrancar HAProxy.
# ============================================================================

resolvers docker
    parse-resolv-conf

    resolve_retries 3

    timeout resolve 1s
    timeout retry   1s

    hold valid     10s
    hold other     10s
    hold refused   10s
    hold nx        10s
    hold timeout   10s
    hold obsolete  10s


# ============================================================================
# HTTP
#
# host :80 -> haproxy :8080
# ============================================================================

frontend fe_http
    bind :8080

    http-request redirect scheme https code 308


# ============================================================================
# HTTPS
#
# host :443 -> haproxy :8443
# ============================================================================

frontend fe_https
    bind :8443 ssl crt "@casa/casa-lan"

    # Cabeceras para los servicios que están detrás del proxy
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443

    # ------------------------------------------------------------------------
    # Hostnames
    # ------------------------------------------------------------------------

    acl is_root hdr(host) -i "${ROOT_HOSTNAME}"

    acl is_buscar  hdr(host) -i "${SEARCH_HOSTNAME}.${ROOT_HOSTNAME}"
    acl is_chat    hdr(host) -i "${CHAT_HOSTNAME}.${ROOT_HOSTNAME}"
    acl is_gwia    hdr(host) -i "${GWIA_HOSTNAME}.${ROOT_HOSTNAME}"
    acl is_git     hdr(host) -i "${GIT_HOSTNAME}.${ROOT_HOSTNAME}"
    acl is_homelab hdr(host) -i "${HOMELAB_HOSTNAME}.${ROOT_HOSTNAME}"
    acl is_agentia hdr(host) -i "${AGENTIA_HOSTNAME}.${ROOT_HOSTNAME}"

    # ------------------------------------------------------------------------
    # Rutas especiales
    # ------------------------------------------------------------------------

    acl is_haproxy_path path_beg /haproxy

    # ------------------------------------------------------------------------
    # Routing
    # ------------------------------------------------------------------------

    use_backend be_stats if is_root is_haproxy_path

    use_backend be_buscar  if is_buscar
    use_backend be_chat    if is_chat
    use_backend be_gwia    if is_gwia
    use_backend be_git     if is_git
    use_backend be_homelab if is_homelab
    use_backend be_agentia if is_agentia

    use_backend be_web if is_root

    default_backend be_web


# ============================================================================
# WEB PRINCIPAL
#
# https://casa.lan
# ============================================================================

backend be_web
    mode http

    server web "${WEB_TARGET}" check resolvers docker init-addr last,none resolve-prefer ipv4


# ============================================================================
# SEARXNG
#
# https://buscar.casa.lan
# ============================================================================

backend be_buscar
    mode http

    server searxng "${SEARCH_TARGET}" check resolvers docker init-addr last,none resolve-prefer ipv4


# ============================================================================
# OPEN WEBUI
#
# https://chat.casa.lan
# ============================================================================

backend be_chat
    mode http

    server open-webui "${CHAT_TARGET}" check resolvers docker init-addr last,none resolve-prefer ipv4


# ============================================================================
# LITELLM
#
# https://gwia.casa.lan
# ============================================================================

backend be_gwia
    mode http

    server litellm "${GWIA_TARGET}" check resolvers docker init-addr last,none resolve-prefer ipv4


# ============================================================================
# GITEA
#
# https://git.casa.lan
# ============================================================================

backend be_git
    mode http

    server gitea "${GIT_TARGET}" check resolvers docker init-addr last,none resolve-prefer ipv4


# ============================================================================
# DOCKHAND
#
# https://homelab.casa.lan
#
# El puerto 3000 NO está publicado en el host.
# HAProxy accede a dockhand:3000 por redlocal.
# ============================================================================

backend be_homelab
    mode http

    server dockhand "${HOMELAB_TARGET}" check resolvers docker init-addr last,none resolve-prefer ipv4


# ============================================================================
# HERMES
#
# https://agentia.casa.lan
#
# El puerto 9119 NO está publicado en el host.
# HAProxy accede a hermes:9119 por redlocal.
#
# TLS termina en HAProxy.
# La conexion HAProxy -> Hermes es HTTP interno.
# ============================================================================

backend be_agentia
    mode http

    server hermes "${AGENTIA_TARGET}" check resolvers docker init-addr last,none resolve-prefer ipv4


# ============================================================================
# ESTADISTICAS HAPROXY
#
# https://casa.lan/haproxy
# ============================================================================

backend be_stats
    mode http

    stats enable
    stats uri /haproxy
    stats refresh 10s
    stats show-node
    stats hide-version


