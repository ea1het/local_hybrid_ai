# =============================================================================
# Stack3 - LiteLLM
#
# Base proxy configuration.
#
# Models and provider credentials are managed in LiteLLM's database so they
# remain editable in the Admin UI. Do not declare model_list here.
#
# MCP servers, virtual keys, access groups, and MCP permissions are also
# managed in LiteLLM/PostgreSQL, not in this static configuration.
#
# Secrets and DATABASE_URL are supplied through Compose environment variables.
# =============================================================================


# -----------------------------------------------------------------------------
# General proxy configuration
# -----------------------------------------------------------------------------

general_settings:

  # LiteLLM administrative credential.
  #
  # The actual value lives only in .env and is injected by Docker.
  master_key: os.environ/LITELLM_MASTER_KEY
