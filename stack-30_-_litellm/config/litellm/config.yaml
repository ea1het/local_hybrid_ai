# =============================================================================
# Stack3 - LiteLLM
#
# Configuracion base del proxy.
#
# Three installation-owned oMLX aliases are always present. Additional
# models can be managed in LiteLLM after installation.
#
# Los MCP servers, virtual keys, access groups y permisos MCP tambien se
# gestionan dinamicamente desde LiteLLM/PostgreSQL. No se declaran aqui para
# no convertir el stack estatico en un catalogo de clientes o integraciones.
#
# Las credenciales, DATABASE_URL y demas secretos se proporcionan mediante
# variables de entorno desde docker-compose.yml.
# =============================================================================


# -----------------------------------------------------------------------------
# Modelos
# -----------------------------------------------------------------------------

# These three aliases need the Mac mini's operator-supplied API key.
model_list:
  - model_name: mlx/local-general
    litellm_params:
      model: openai/mlx/local-general
      api_base: os.environ/OMLX_BASE_URL
      api_key: os.environ/OMLX_API_KEY
  - model_name: mlx/local-agent
    litellm_params:
      model: openai/mlx/local-agent
      api_base: os.environ/OMLX_BASE_URL
      api_key: os.environ/OMLX_API_KEY
  - model_name: mlx/local-coding
    litellm_params:
      model: openai/mlx/local-coding
      api_base: os.environ/OMLX_BASE_URL
      api_key: os.environ/OMLX_API_KEY


# -----------------------------------------------------------------------------
# Configuracion general del proxy
# -----------------------------------------------------------------------------

general_settings:

  # Credencial administrativa principal de LiteLLM.
  #
  # El valor real vive exclusivamente en .env y sera inyectado por Docker.
  master_key: os.environ/LITELLM_MASTER_KEY
