name: Stack1 - HAProxy + Web

services:

  haproxy:
    image: ${HAPROXY_IMAGE:-haproxy}:${HAPROXY_VERSION:-3.0.26-alpine3.24}
    container_name: haproxy
    restart: unless-stopped

    # Official haproxy image runs as uid/gid 99. Stack0 (install-tls-certs.py)
    # installs tls.key as root:PLATFORM_PKI_GID 0640, so read access is granted
    # only through this dedicated supplementary group.
    group_add:
      - "${PLATFORM_PKI_GID:-1999}"

    networks:
      - redlocal

    ports:
      - "0.0.0.0:${HAPROXY_HTTP_PORT:-80}:8080"
      - "0.0.0.0:${HAPROXY_HTTPS_PORT:-443}:8443"

    volumes:
      # haproxy.cfg (Stack1) plus tls.crt / tls.key (Stack0 install-tls-certs.py).
      # The directory is mounted rather than individual files so renewed
      # certificates remain visible after a controlled HAProxy restart.
      - ${BASE_PATH:?Set BASE_PATH in .env}/service_-_haproxy/config:/usr/local/etc/haproxy:ro

    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    environment:
      ROOT_HOSTNAME: ${ROOT_HOSTNAME:-casa.lan}

      WEB_TARGET: ${WEB_TARGET:-web:80}

      SEARCH_HOSTNAME: ${SEARCH_HOSTNAME:-buscar}
      SEARCH_TARGET: ${SEARCH_TARGET:-searxng:8080}

      CHAT_HOSTNAME: ${CHAT_HOSTNAME:-chat}
      CHAT_TARGET: ${CHAT_TARGET:-open-webui:8080}

      GIT_HOSTNAME: ${GIT_HOSTNAME:-git}
      GIT_TARGET: ${GIT_TARGET:-gitea:3000}

      GWIA_HOSTNAME: ${GWIA_HOSTNAME:-gwia}
      GWIA_TARGET: ${GWIA_TARGET:-litellm:4000}

      HOMELAB_HOSTNAME: ${HOMELAB_HOSTNAME:-homelab}
      HOMELAB_TARGET: ${HOMELAB_TARGET:-dockhand:3000}

      NORAI_HOSTNAME: ${NORAI_HOSTNAME:-norai}
      NORAI_TARGET: ${NORAI_TARGET:-hermes:9119}

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"


  web:
    image: busybox:1.38.0
    container_name: web
    restart: unless-stopped

    command: httpd -f -p 80 -h /www

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - redlocal

    volumes:
      - ${BASE_PATH:?Set BASE_PATH in .env}/service_-_web:/www:ro


networks:
  redlocal:
    external: true
    name: ${NETWORK_NAME:-redlocal}
