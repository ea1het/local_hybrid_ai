name: Stack3 - LiteLLM

services:

  litellm:
    image: ${LITELLM_IMAGE}:${LITELLM_VERSION}
    container_name: litellm
    restart: unless-stopped

    command:
      - "--config=/app/config.yaml"
      - "--port=4000"
      - "--num_workers=1"

    volumes:
      - ${BASE_PATH:?Set BASE_PATH in .env}/service_-_litellm/config/config.yaml:/app/config.yaml:ro

    environment:

      # -----------------------------------------------------------------------
      # LiteLLM
      # -----------------------------------------------------------------------

      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY}"

      UI_USERNAME: "${UI_USERNAME}"
      UI_PASSWORD: "${UI_PASSWORD}"

      STORE_MODEL_IN_DB: "${STORE_MODEL_IN_DB}"

      # Oculta en la UI el mensaje que sugiere las credenciales por defecto.
      LITELLM_HIDE_DEFAULT_CREDENTIALS_HINT: "true"


      # -----------------------------------------------------------------------
      # PostgreSQL
      #
      # PostgreSQL pertenece a Stack2.
      # Stack3 accede exclusivamente con su usuario y base propios.
      # -----------------------------------------------------------------------

      DATABASE_URL: "postgresql://${LITELLM_DB_USER}:${LITELLM_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${LITELLM_DB_NAME}"


    networks:
      - redlocal


    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""
        ]

      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


networks:

  redlocal:
    external: true
    name: redlocal
